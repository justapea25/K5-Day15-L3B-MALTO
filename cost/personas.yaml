# Mô phỏng chi phí MALTO theo guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người trực tiếp dùng MALTO để chọn quán cho nhóm
  low: 100
  base: 300
  high: 500
  source: "(tự ước tính) Ba kịch bản thử nghiệm MALTO, chưa có số người dùng đo được."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.5897           # tỉ lệ người dùng kiểu này
    uses_per_month: 0.5     # số phiên / người / tháng
    turns_per_session: 1    # số lượt hỏi trong một phiên
    source: "(tự ước tính) Tham chiếu 23/39 người khảo sát đặt nhóm dưới 1 lần/tháng (evidence/summary.md §2.2). Giả định 0,5 phiên MALTO/tháng và 1 lượt hỏi/phiên."
  - name: dung_vua
    share: 0.3077
    uses_per_month: 2
    turns_per_session: 2
    source: "(tự ước tính) Khảo sát ghi 16/39 người đặt nhóm từ mức 1–3 lần/tháng trở lên (evidence/summary.md §2.2). Giả định 12/39 thuộc nhóm dùng vừa, 2 phiên/tháng và 2 lượt hỏi/phiên."
  - name: dung_nhieu
    share: 0.1026
    uses_per_month: 4
    turns_per_session: 3
    source: "(tự ước tính) Giả định 4/39 thuộc nhóm dùng nhiều. Tần suất 4 phiên/tháng tham chiếu việc đặt nhóm của P1 (spec.md §2.4). Giả định 3 lượt hỏi/phiên."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token · giá Standard, chưa áp giá cache riêng
  - model: gpt-6-luna     # model dùng để đo token
    input: 0.10
    output: 0.50
    source: "https://developers.openai.com/api/docs/models/gpt-6-luna · xem 28/11/2026"
  - model: gpt-6.1-terra  # giá đối chiếu trên token đo bằng Luna
    input: 1.00
    output: 5.00
    source: "https://developers.openai.com/api/docs/models/gpt-6.1-terra · xem 28/11/2026"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
